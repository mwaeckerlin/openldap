services:
  openldap:
    image: mwaeckerlin/openldap
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:389:389"
      - "${BIND_ADDRESS:-127.0.0.1}:636:636"
    environment:
      DOMAIN: example.com
      PASSWORD: "123"
      INIT_SCRIPT: /var/init/init.ldif
      CUSTOM_SCHEMAS: /var/schemas
      SCHEMAS: cosine inetorgperson nis samba
    volumes:
      - ./init.ldif:/var/init/init.ldif:ro
      - ./schemas:/var/schemas:ro
